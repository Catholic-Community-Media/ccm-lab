name: db-backup
on:
  schedule:
    - cron: '0 8 * * *' # 2–3 AM Central
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      PG_MAJOR: '18'
    steps:
      - name: Install Postgres client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
      - name: Dump
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI_DIRECT }}
        run: |
          FILE="ccm-lab-$(date -u +%Y-%m-%dT%H%MZ).dump"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" "$DATABASE_URI" -Fc --no-owner -f "$FILE"
          test -s "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp "$FILE" "s3://ccm-lab-backups/db/$FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
